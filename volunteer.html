<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volunteer Registration | Sarvyahith</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/volunteer.css">

</head>

<body>

<section class="volunteer-form">

    <div class="form-container">

        <a href="index.html" class="back-btn">
            ← Back to Home |
        </a>

        <span class="section-tag">
            JOIN OUR TEAM
        </span>

        <h2>
            Volunteer Registration
        </h2>

        <p>
            Thank you for your interest in joining Sarvyahith. Kindly fill in your details below.
        </p>

        <form>

            <div class="form-group">

                <input type="text" placeholder="Full Name" required>

                <input type="email" placeholder="Email Address" required>

            </div>

            <div class="form-group">

                <input type="tel" placeholder="Phone Number" required>

                <input type="number" placeholder="Age" required>

            </div>

            <div class="form-group">

                <input type="text" placeholder="City" required>

                <input type="text" placeholder="State" required>

            </div>

            <div class="form-group">

                <select required>

                    <option value="">Gender</option>

                    <option>Male</option>

                    <option>Female</option>

                    <option>Other</option>

                </select>

                <select required>

                    <option value="">Area of Interest</option>

                    <option>Content Writing</option>

                    <option>Tutoring Department</option>

                    <option>Graphic Designing</option>

                    <option>Video Editing</option>

                    <option>Content Creation</option>

                    <option>Journalism Department</option>
                    
                    <option>Data Management</option>

                    <option>Web Development</option>

                    <option>Videography</option>

                    <option>Photography</option>

                    <option>Partnership Co-ordination</option>

                    <option>On Ground volunteer</option>

                </select>

            </div>

            <textarea rows="6" placeholder="Why do you want to volunteer with Sarvyahith?"></textarea>

            <button type="submit" class="volunteer-btn">
                Submit Application
            </button>

        </form>

    </div>

</section>

</body>

</html>
